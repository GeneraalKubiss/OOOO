<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Valentine 💖</title>
    <style>
        body {
            min-height: 100vh;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #ff9a9e, #fad0c4);
        }

        .container {
            text-align: center;
        }

        h1 {
            font-size: 3rem;
            color: #d6005a;
            margin-bottom: 30px;
        }

        .buttons {
            position: relative;
            width: 260px;
            height: 120px;
            margin: 0 auto 15px;
        }

        button {
            font-size: 1.2rem;
            padding: 12px 25px;
            border: none;
            border-radius: 12px;
            cursor: pointer;
        }

        #yes {
            background-color: #ff4d6d;
            color: white;
            position: absolute;
            left: 0;
            bottom: 0;
        }

        #no {
            background-color: #555;
            color: white;
            position: absolute;
            right: 0;
            bottom: 0;
        }

        .hint {
            font-size: 1rem;
            color: #333;
            opacity: 0.8;
        }

        .yay {
            display: none;
            text-align: center;
        }

        .yay h2 {
            font-size: 3rem;
            color: #ff1e56;
        }

        .yay img {
            width: 260px;
            margin-top: 20px;
            border-radius: 20px;
        }
    </style>
</head>
<body>

<div class="container" id="question">
    <h1>Will you be my Valentine? 💘</h1>

    <div class="buttons">
        <button id="yes">YES</button>
        <button id="no">NO</button>
    </div>

    <div class="hint">
        Hmm… NO nevypadá moc dobře 🤨
    </div>
</div>

<div class="yay" id="yay">
    <h2>YAY!!! 🎉💖</h2>
    <img src="https://media.giphy.com/media/26ufdipQqU2lhNA4g/giphy.gif" alt="Happy GIF">
</div>

<script>
    const noBtn = document.getElementById("no");
    const yesBtn = document.getElementById("yes");
    const question = document.getElementById("question");
    const yay = document.getElementById("yay");

    noBtn.addEventListener("mouseover", () => {
        const x = Math.random() * 160 - 80;
        const y = Math.random() * 80 - 40;
        noBtn.style.transform = `translate(${x}px, ${y}px)`;
    });

    yesBtn.addEventListener("click", () => {
        question.style.display = "none";
        yay.style.display = "block";
    });
</script>

</body>
</html>
